name: build-and-test

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize]

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.0.x'
                cache: false
            
            - name: Install dependencies
              run: dotnet restore SreTakeHome.sln 

            - name: Build
              run: dotnet build SreTakeHome.sln -c Release --no-restore

            - name: Unit testing
              run: dotnet test SreTakeHome.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory Test-Results 

            - name: Publish results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: unit-test-results
                path: Test-Results/*.trx
                if-no-files-found: warn

    pack-and-publish-nugets:
      name: Pack Contracts NuGet
      runs-on: ubuntu-latest
      needs: build

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '10.0.x'
            cache: false
        
        - name: Create artifacts directory
          run: mkdir -p artifacts

        - name: Restore Contracts
          run: dotnet restore src/CandidateApi.Contracts/CandidateApi.Contracts.csproj

        - name: Pack NuGet
          run: |
            dotnet pack src/CandidateApi.Contracts/CandidateApi.Contracts.csproj \
              -c Release \
              --no-restore \
              -o ./artifacts/Packages
        - name: Push package to GitHub Packages
          run: |
            dotnet nuget push "artifacts/*.nupkg" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.NUGET_TOKEN }}"
  
    docker-build:
      name: Build Docker image
      runs-on: ubuntu-latest
      needs: build
      
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Build Docker Image
          run: |
            docker build \
             -t coterieapi \
             -f Dockerfile \
             .