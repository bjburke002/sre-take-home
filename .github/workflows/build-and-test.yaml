name: build-and-test

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize]

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.0.x'
                cache: true
            
            - name: Install dependencies
              run: dotnet restore SreTakeHome.sln 

            - name: Build
              run: dotnet build SreTakeHome.sln -c Release --no-restore

            - name: Unit testing
              run: dotnet test SreTakeHome.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory Test-Results 

            - name: Publish results
              if: always()
              uses: actions/upload-artifacts@v4
              with:
                name: unit-test-results
                path: Test-Results/*.trx
                if-no-files-found: warn
            
