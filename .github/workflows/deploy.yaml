name: Deploy Candidate API

on:
  push:
    branches:
      - main


permissions:
  contents: read
  id-token: write
  packages: write


jobs:

  build:

    name: Build and Push Image

    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.image.outputs.tag }}


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'


      - name: Restore
        run: |
          dotnet restore SreTakeHome.sln


      - name: Build
        run: |
          dotnet build SreTakeHome.sln \
            -c Release \
            --no-restore


      - name: Test
        run: |
          dotnet test SreTakeHome.sln \
            -c Release \
            --no-build


      #
      # NuGet package
      #

      - name: Pack Contracts Package
        run: |

          mkdir artifacts

          dotnet pack \
            src/CandidateApi.Contracts/CandidateApi.Contracts.csproj \
            -c Release \
            -p:Version=1.0.0-preview.${{ github.run_number }} \
            -o artifacts


      - name: Publish NuGet
        run: |

          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.NUGET_TOKEN }}"


      #
      # Docker -> ACR
      #

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID}}

      - name: Login to ACR
        run: |

          az acr login \
            --name ${{ secrets.ACR_NAME }}


      - name: Build and Push Image
        id: image
        run: |

          IMAGE=${{ secrets.ACR_NAME }}/candidate-api:${{ github.sha }}

          docker build \
            -t $IMAGE \
            .

          docker push $IMAGE

          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT



  deploy-dev:

    name: Deploy DEV AKS
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID}}


      - name: Get DEV AKS credentials
        run: |

          az aks get-credentials \
            --resource-group ${{ secrets.DEV_RESOURCE_GROUP }} \
            --name ${{ secrets.DEV_CLUSTER }} \
            --overwrite-existing


      - name: Deploy Helm
        run: |

          helm upgrade --install candidate-api \
            ./charts \
            --namespace dev \
            --create-namespace \
            -f ./charts/environments/values.dev.yaml \
            --set image.tag=${{ needs.build.outputs.image-tag }}


      - name: Verify Rollout
        run: |

          kubectl rollout status \
            deployment/candidate-api \
            -n dev \
            --timeout=180s



  deploy-test:

    name: Deploy TEST AKS
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID}}


      - name: Get TEST AKS credentials
        run: |

          az aks get-credentials \
            --resource-group ${{ secrets.TEST_RESOURCE_GROUP }} \
            --name ${{ secrets.TEST_CLUSTER }} \
            --overwrite-existing


      - name: Deploy Helm
        run: |

          helm upgrade --install candidate-api \
            ./charts \
            --namespace test \
            --create-namespace \
            -f ./charts/environments/values.test.yaml \
            --set image.tag=${{ needs.build.outputs.image-tag }}


      - name: Verify Rollout
        run: |

          kubectl rollout status \
            deployment/candidate-api \
            -n test \
            --timeout=180s