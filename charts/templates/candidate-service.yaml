apiVersion: v1
kind: Service

metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ include "app.name" . }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}